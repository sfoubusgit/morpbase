<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MorpBase Manual</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", "SF Pro Text", "Inter", sans-serif;
        background: #0d0d12;
        color: #f5f5f5;
      }
      .manual-shell {
        max-width: 980px;
        margin: 0 auto;
        padding: 48px 24px 80px;
      }
      .manual-card {
        background: rgba(26, 26, 31, 0.98);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        padding: 32px 36px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      }
      h1 {
        font-size: 32px;
        margin: 0 0 16px;
        color: #ffffff;
      }
      h2 {
        font-size: 22px;
        margin: 28px 0 12px;
        color: #dfe3ff;
      }
      h3 {
        font-size: 18px;
        margin: 22px 0 10px;
        color: #cbd5f5;
      }
      p {
        line-height: 1.6;
        margin: 10px 0;
        color: #cbd5f5;
      }
      ul, ol {
        padding-left: 22px;
        margin: 10px 0 14px;
        color: #cbd5f5;
      }
      li {
        margin: 6px 0;
      }
      code {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        padding: 2px 6px;
        font-size: 0.92em;
      }
      pre {
        background: #111118;
        color: #f5f5f5;
        padding: 16px;
        border-radius: 12px;
        overflow-x: auto;
        margin: 16px 0;
      }
      pre code {
        background: transparent;
        border: none;
        padding: 0;
        color: inherit;
      }
      hr {
        border: none;
        height: 1px;
        background: rgba(255, 255, 255, 0.08);
        margin: 24px 0;
      }
      a {
        color: #8aa5ff;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .manual-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      .manual-chip {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(110, 86, 249, 0.18);
        border: 1px solid rgba(110, 86, 249, 0.35);
        color: #e1dcff;
      }
      .manual-muted {
        font-size: 12px;
        color: #9fa0b8;
      }
      .spacer {
        height: 12px;
      }
    </style>
  </head>
  <body>
    <div class="manual-shell">
      <div class="manual-card">
        <div class="manual-title">
          <h1>MorpBase Manual</h1>
          <span class="manual-chip">Beta</span>
        </div>
        <div class="manual-muted">Last updated: 2026-03-05</div>
        <div class="spacer"></div>
        <div id="manual-content"></div>
      </div>
    </div>

    <script>
      const escapeHtml = (text) =>
        text.replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");

      const renderInline = (text) => {
        const escaped = escapeHtml(text);
        return escaped
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      };

      const renderMarkdown = (md) => {
        const lines = md.split(/\r?\n/);
        let html = '';
        let inCode = false;
        let listType = null;

        const closeList = () => {
          if (listType) {
            html += listType === 'ol' ? '</ol>' : '</ul>';
            listType = null;
          }
        };

        lines.forEach((rawLine) => {
          const line = rawLine.trimEnd();

          if (line.startsWith('```')) {
            if (!inCode) {
              closeList();
              inCode = true;
              html += '<pre><code>';
            } else {
              inCode = false;
              html += '</code></pre>';
            }
            return;
          }

          if (inCode) {
            html += escapeHtml(rawLine) + '\n';
            return;
          }

          if (line.startsWith('<a ') || line.startsWith('<a id=')) {
            closeList();
            html += line;
            return;
          }

          if (!line) {
            closeList();
            html += '<div class="spacer"></div>';
            return;
          }

          if (line.startsWith('# ')) {
            closeList();
            html += `<h1>${renderInline(line.slice(2))}</h1>`;
            return;
          }
          if (line.startsWith('## ')) {
            closeList();
            html += `<h2>${renderInline(line.slice(3))}</h2>`;
            return;
          }
          if (line.startsWith('### ')) {
            closeList();
            html += `<h3>${renderInline(line.slice(4))}</h3>`;
            return;
          }

          if (/^\*\*[^*]+\*\*$/.test(line)) {
            closeList();
            html += `<h3>${renderInline(line.replace(/\*\*/g, ''))}</h3>`;
            return;
          }

          if (/^\d+\.\s+/.test(line)) {
            if (listType !== 'ol') {
              closeList();
              html += '<ol>';
              listType = 'ol';
            }
            html += `<li>${renderInline(line.replace(/^\d+\.\s+/, ''))}</li>`;
            return;
          }

          if (line.startsWith('- ')) {
            if (listType !== 'ul') {
              closeList();
              html += '<ul>';
              listType = 'ul';
            }
            html += `<li>${renderInline(line.slice(2))}</li>`;
            return;
          }

          if (line.startsWith('---')) {
            closeList();
            html += '<hr />';
            return;
          }

          closeList();
          html += `<p>${renderInline(line)}</p>`;
        });

        closeList();
        return html;
      };

      fetch('manual.md')
        .then((res) => res.text())
        .then((md) => {
          document.getElementById('manual-content').innerHTML = renderMarkdown(md);
        })
        .catch(() => {
          document.getElementById('manual-content').innerHTML = '<p>Failed to load manual.</p>';
        });
    </script>
  </body>
</html>
